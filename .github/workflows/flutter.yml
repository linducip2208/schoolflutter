name: flutter

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: dart format --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      # CI debug build must never point at production or a placeholder domain:
      # 10.0.2.2 is emulator loopback (non-routable), matching the dev default
      # in lib/core/config/app_config.dart. Analyze + test above always run
      # before this build step.
      - run: flutter build apk --debug --dart-define=API_BASE_URL=http://10.0.2.2:8000/api/v1 --dart-define=APP_ENV=development
